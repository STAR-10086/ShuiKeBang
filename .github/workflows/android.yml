name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# 默认最小权限：普通构建/PR 只读；只有 release job 单独提升为可写
permissions:
  contents: read

jobs:
  # 普通提交 / PR：编译 + 单元测试 + lint 门禁
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check repository reachability
        run: |
          echo "plugin-portal:"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.20-1.0.25/com.google.devtools.ksp.gradle.plugin-2.0.20-1.0.25.pom
          echo "maven-central:"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/2.0.20-1.0.25/symbol-processing-gradle-plugin-2.0.20-1.0.25.pom
          echo "google-maven:"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/maven-metadata.xml

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint (report only)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 仅在打 v* tag 时运行：构建 arm64 / arm-v7a / universal 三个 release 包并发 Release
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 仅发版 job 需要创建/上传 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/ci-release.jks"
          # 用密码自检解码出的密钥库确实可读（keytool 随 setup-java 提供）
          keytool -list -keystore "$GITHUB_WORKSPACE/ci-release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build split release APKs (arm64-v8a / armeabi-v7a / universal)
        env:
          # build.gradle.kts 读取这四个 RELEASE_*（local.properties 或环境变量）完成正式签名
          RELEASE_STORE_FILE: ci-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PsplitAbi --no-daemon --stacktrace

      - name: Rename APKs with version
        run: |
          V="${GITHUB_REF_NAME}"
          cd app/build/outputs/apk/release
          mv app-arm64-v8a-release.apk      "shuikebang-${V}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk    "shuikebang-${V}-armeabi-v7a.apk"
          mv app-universal-release.apk     "shuikebang-${V}-universal.apk"
          ls -lh

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: "水课帮 Android ${{ github.ref_name }}"
          generate_release_notes: true
          # tag 名含 beta/alpha/rc 自动标记为预发行版
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            app/build/outputs/apk/release/shuikebang-*-arm64-v8a.apk
            app/build/outputs/apk/release/shuikebang-*-armeabi-v7a.apk
            app/build/outputs/apk/release/shuikebang-*-universal.apk
          body: |
            课堂提问助手 Android v0.2.1，首个使用**自有正式签名**的版本（此后版本沿用同一签名，可直接覆盖升级）。

            ### 本版更新（v0.2.1）
            - 修复选中模型不生效：现在以你在模型页选择的模型为准，不会再“下了小模型又自动去下双语大模型”，首页显示真实模型名。
            - 录音开始/暂停/继续/停止改为串行状态机、停止幂等，修复快速连点或多入口同时操作可能导致的崩溃与最后一句丢失。
            - 麦克风启动失败会自动回滚、采集中途出错会明确提示并停止，不再出现“显示录制中却没在收音”的假录音。
            - 历史课堂时长改为只计实际录音时间，暂停时间不再计入。
            - 点提问通知可直接跳转到对应课堂并定位该问题（应用在前台也生效）。
            - 模型下载支持真正断点续传；模型页新增“重新下载 / 删除模型”，模型损坏可自助恢复。
            - 「标记重点」现在会真正保存，历史列表支持课堂重命名。
            - 本地 Ollama / LM Studio 可用：局域网/本机允许 http 且 Key 可留空，外部端点仍强制 https + Key。
            - 修复隐式 PendingIntent（CWE-927）安全告警，全部改为显式组件 + FLAG_IMMUTABLE。

            ### 下载说明（按手机架构选择）
            - **arm64-v8a**：2019 年后绝大多数手机，体积最小，优先选它。
            - **armeabi-v7a**：老旧 32 位 ARM 手机。
            - **universal**：全架构通用包，体积最大，不确定架构时选它。

            > 安装后首次点“开始记录”会下载离线识别模型（仅这一步联网，建议 WiFi），模型不打进 APK；音频全程本地离线识别、不保存不上传。
